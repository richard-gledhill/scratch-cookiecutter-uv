name: Docs

# Runs instead of main.yml when a change touches only Markdown. Tests read AGENTS.md,
# README.md and docs/development/, so they still run, on one Python in one job.
# Keep paths: here identical to main.yml's paths-ignore.
on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run pre-commit
        run: uv run pre-commit run -a

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check if documentation can be built
        run: uv run mkdocs build -s
