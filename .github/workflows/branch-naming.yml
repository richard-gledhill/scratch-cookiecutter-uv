name: Branch naming

# Branch names use <type>/<short-description>, where <type> is a Conventional Commits
# type (https://www.conventionalcommits.org/en/v1.0.0/), the same set used for commit
# subjects. See docs/development/conventions.md (Git).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-branch-name:
    # Dependabot branches are always prefixed "dependabot/" (not configurable via
    # dependabot.yml), so they can never match the pattern below - exempt them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name against Conventional Commits prefixes
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)/[a-z0-9._-]+$'
          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "::error::Branch name '$BRANCH_NAME' doesn't match the required pattern."
            echo "Expected: <type>/<short-description> in lowercase, where <type> is a Conventional Commits type:"
            echo "  feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert"
            echo "See https://www.conventionalcommits.org/en/v1.0.0/"
            echo "Example: feat/config-command, chore/update-gitignore"
            exit 1
          fi
          echo "Branch name '$BRANCH_NAME' is valid."
