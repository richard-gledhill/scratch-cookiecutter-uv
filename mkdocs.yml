site_name: scratch-cookiecutter-uv
repo_url: https://github.com/richard-gledhill/scratch-cookiecutter-uv
site_url: https://richard-gledhill.github.io/scratch-cookiecutter-uv
site_description: This is a scratch repository template using cookiecutter-uv used to test personal customisation.
site_author: Richard Gledhill
edit_uri: edit/main/docs/
repo_name: richard-gledhill/scratch-cookiecutter-uv
copyright: Maintained by <a href="https://richard-gledhill.com">richard-gledhill</a>.

# docs/development/ holds internal docs
exclude_docs: |
  development/

nav:
  - Home: index.md
  - How to use: how-to-use.md
  - API reference: modules.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - License: license.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/scratch_cookiecutter_uv"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/richard-gledhill/scratch-cookiecutter-uv

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      check_paths: true
