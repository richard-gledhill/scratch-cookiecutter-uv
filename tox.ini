[tox]
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
# tox-uv: sync each env from uv.lock into its own venv, leaving the project .venv alone.
runner = uv-venv-lock-runner
dependency_groups = dev
passenv = PYTHON_VERSION
commands =
    python -m pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    mypy
